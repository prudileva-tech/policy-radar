name: Daily Policy Radar
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collector/**'
      - 'config/**'
      - '.github/workflows/**'
  schedule:
    - cron: '20 4 * * 1-5'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python collector/run.py
      - name: Commit updated radar data
        run: |
          git config user.name "policy-radar-bot"
          git config user.email "policy-radar-bot@users.noreply.github.com"
          git add docs/data/radar.json docs/data/state.json docs/data/archive.json
          git diff --cached --quiet || git commit -m "chore: daily policy radar update"
          git push
